name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Distribution & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies & build tool
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run full test suite
        run: pytest -v

      - name: Build sdist and wheel distributions
        run: python -m build

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish-pypi:
    name: Publish Package to PyPI
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publisher (OIDC token exchange)
    environment:
      name: pypi
      url: https://pypi.org/p/lazyload-py
    steps:
      - name: Retrieve distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish package via Trusted Publisher OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
