# ╔══════════════════════════════════════════════════════════════════════╗
# ║  pyproject.toml — single source of truth for the lazyload package   ║
# ║  Build backend : hatchling                                           ║
# ║  Tooling       : ruff · mypy · pytest · coverage                    ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ──────────────────────────────────────────────
# Build system
# ──────────────────────────────────────────────
[build-system]
requires      = ["hatchling>=1.25"]
build-backend = "hatchling.build"


# ──────────────────────────────────────────────
# Project metadata  (PEP 621)
# ──────────────────────────────────────────────
[project]
name            = "lazyload"
version         = "0.1.0"
description     = "Lazy imports for Python 3.10 through 3.15+ — one API, every version."
readme          = { file = "README.md", content-type = "text/markdown" }
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [
    { name = "jithubaiju55", email = "jithubaiju124@gmail.com" },
]
maintainers = [
    { name = "jithubaiju55", email = "jithubaiju124@gmail.com" },
]
keywords = [
    "lazy",
    "imports",
    "performance",
    "startup",
    "cli",
    "lazy-loading",
    "import-hooks",
]
classifiers = [
    # Project maturity
    "Development Status :: 3 - Alpha",

    # Audience
    "Intended Audience :: Developers",

    # License
    "License :: OSI Approved :: MIT License",

    # OS
    "Operating System :: OS Independent",

    # Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    # Topics
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Boot",
    "Topic :: Utilities",

    # Typing
    "Typing :: Typed",
]

# No mandatory runtime dependencies — lazyload is zero-dependency by design.
dependencies = []


# ──────────────────────────────────────────────
# Project URLs
# ──────────────────────────────────────────────
[project.urls]
Homepage   = "https://github.com/jithubaiju55/lazyload"
Repository = "https://github.com/jithubaiju55/lazyload"
Issues     = "https://github.com/jithubaiju55/lazyload/issues"
Changelog  = "https://github.com/jithubaiju55/lazyload/blob/main/CHANGELOG.md"


# ──────────────────────────────────────────────
# Optional dependency groups
# ──────────────────────────────────────────────
[project.optional-dependencies]

# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Install with: pip install -e ".[bench]"
bench = [
    "pytest-benchmark>=4.0",
    "memory-profiler>=0.61",
]


# ──────────────────────────────────────────────
# Hatchling — build & wheel configuration
# ──────────────────────────────────────────────
[tool.hatch.build]
# Exclude developer-only artefacts from the published wheel.
exclude = [
    "tests/",
    "benchmarks/",
    "docs/",
    ".github/",
]

[tool.hatch.build.targets.wheel]
packages = ["lazyload"]

[tool.hatch.build.targets.sdist]
# Include everything meaningful for source builds.
include = [
    "lazyload/",
    "tests/",
    "docs/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]


# ──────────────────────────────────────────────
# Hatch environments (optional local workflows)
# ──────────────────────────────────────────────
[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test     = "pytest {args}"
cov      = "pytest --cov=lazyload --cov-report=term-missing --cov-report=html {args}"
lint     = "ruff check lazyload tests"
fmt      = "ruff format lazyload tests"
typecheck = "mypy lazyload"
all      = ["fmt", "lint", "typecheck", "test"]

[tool.hatch.envs.bench]
features = ["bench"]

[tool.hatch.envs.bench.scripts]
run = "pytest benchmarks/ --benchmark-autosave {args}"


# ──────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths        = ["tests"]
addopts          = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--cov=lazyload",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
]
filterwarnings   = ["error"]
xfail_strict     = true
log_cli          = true
log_cli_level    = "WARNING"


# ──────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────
[tool.coverage.run]
source    = ["lazyload"]
branch    = true
parallel  = true
omit      = [
    "lazyload/__main__.py",   # entry-point boilerplate
    "lazyload/_native.py",    # Python 3.15+ native backend (skipped on <3.15)
    "lazyload/_lazy.py",      # Stub file
    "lazyload/_context.py",   # Stub file
    "lazyload/_decorator.py", # Stub file
    "lazyload/_types.py",     # Protocol definition file
    "tests/*",
    "benchmarks/*",
]

[tool.coverage.report]
show_missing    = true
skip_covered    = false
skip_empty      = true
precision       = 2
fail_under      = 90
exclude_lines   = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.\\s*$",          # bare ellipsis stubs
]

[tool.coverage.html]
directory = "htmlcov"
title     = "lazyload coverage report"

[tool.coverage.xml]
output = "coverage.xml"


# ──────────────────────────────────────────────
# Ruff — linter + formatter
# ──────────────────────────────────────────────
[tool.ruff]
line-length     = 88
indent-width    = 4
target-version  = "py310"
src             = ["lazyload", "tests", "benchmarks"]
exclude         = ["README.md"]

[tool.ruff.lint]
# Full rule selection — strict and modern.
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific rules
]

ignore = [
    # Docstrings — relax missing docs on private / dunder items and __init__
    "D100",   # missing docstring in public module
    "D101",   # missing docstring in public class
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)

    # Commas — trailing comma in closing bracket is opinionated
    "COM812",

    # Quotes — handled by formatter
    "Q000", "Q001", "Q002", "Q003",

    # Builtins & Shadowing — intentional shadowing for public ModuleNotFoundError, globals/locals
    "A001",
    "A002",
    "A004",

    # Exception Naming — UnsupportedPythonVersion is public API contract
    "N818",

    # Type checking imports & sorting — keep runtime imports simple
    "TC003",
    "RUF022",
    "UP030",
    "F841",
    "BLE001",
    "PLR0915",
    "PLW0603",
    "PTH100",
    "PTH120",
    "E402",

    # Try/except & exceptions — allow standard exception messages & patterns
    "TRY003",
    "TRY301",
    "EM101",
    "EM102",

    # Typing — allow Any in *args/**kwargs
    "ANN401",

    # Unicode — allow dash punctuation in docstrings & comments
    "RUF001",
    "RUF002",
    "RUF003",

    # Line length — handled by formatter
    "E501",

    # Simplify — allow explicit try-except and nested with blocks
    "SIM105",
    "SIM117",

    # PLR — allow magic values in tests
    "PLR2004",

    # S101 — allow assert in tests
    "S101",
]

# Per-file rule overrides
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"        = ["ANN", "D", "S", "ARG", "EM", "TRY", "PLC", "ERA", "A", "F401", "TC", "RUF001", "RUF002", "RUF003"]
"benchmarks/**/*.py"   = ["ANN", "D", "S", "T20", "EM", "TRY", "PLC", "ERA", "A", "F401", "TC", "RUF001", "RUF002", "RUF003"]
"lazyload/__init__.py" = ["F401"]   # re-exports are intentional

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party    = ["lazyload"]
force-sort-within-sections = true
split-on-trailing-comma    = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pylint]
max-args     = 8
max-branches = 12
max-returns  = 6

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false
line-ending              = "lf"
docstring-code-format    = true
docstring-code-line-length = 72


# ──────────────────────────────────────────────
# Mypy — static type checker
# ──────────────────────────────────────────────
[tool.mypy]
python_version         = "3.10"
warn_return_any        = false
warn_unused_configs    = true
warn_unused_ignores    = false
warn_redundant_casts   = true
disallow_any_generics  = false
disallow_untyped_defs = false
allow_untyped_defs    = true
disallow_incomplete_defs = false
check_untyped_defs     = true
no_implicit_reexport   = false
show_error_codes       = true
show_column_numbers    = true
pretty                 = true
ignore_missing_imports = true

